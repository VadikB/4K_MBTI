name: Full verification

run-name: Full verification — ${{ github.ref_name }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: full-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent4k_pytest
          POSTGRES_USER: pytest
          POSTGRES_PASSWORD: pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytest -d agent4k_pytest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_POOL_MIN_SIZE: "0"
      DEEPSEEK_API_KEYS: ""
      TEST_DATABASE_URL: postgresql://pytest:pytest@127.0.0.1:5432/agent4k_pytest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install \
            "fastapi>=0.115.0" \
            "pydantic>=2.0.0" \
            "psycopg[binary]>=3.2.0" \
            "psycopg_pool>=3.2.0" \
            "python-dotenv>=1.0.1" \
            "typst>=0.14.8" \
            "pypdf>=6.0.0" \
            "pytest>=8.3.0" \
            "pytest-cov>=6.0.0" \
            "httpx2" \
            "uvicorn>=0.30.0"

      - name: Integration tests
        shell: bash
        run: |
          set +e
          python -m pytest --run-integration -m integration > /tmp/integration-tests.log 2>&1
          status=$?
          cat /tmp/integration-tests.log
          if [ "$status" -ne 0 ]; then
            details="$(tail -n 80 /tmp/integration-tests.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Integration tests failed::$details"
            exit "$status"
          fi

  browser:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: fast
            shard: ""
          - lane: runtime-1-of-4
            shard: "1/4"
          - lane: runtime-2-of-4
            shard: "2/4"
          - lane: runtime-3-of-4
            shard: "3/4"
          - lane: runtime-4-of-4
            shard: "4/4"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent4k_pytest
          POSTGRES_USER: pytest
          POSTGRES_PASSWORD: pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytest -d agent4k_pytest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_POOL_MIN_SIZE: "0"
      DEEPSEEK_API_KEYS: ""
      STAND_ADMIN_URL: postgresql://pytest:pytest@127.0.0.1:5432/postgres
      BROWSER_PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser backend dependencies
        run: |
          python -m pip install \
            "fastapi>=0.115.0" \
            "pydantic>=2.0.0" \
            "psycopg[binary]>=3.2.0" \
            "psycopg_pool>=3.2.0" \
            "python-dotenv>=1.0.1" \
            "typst>=0.14.8" \
            "pypdf>=6.0.0" \
            "pytest>=8.3.0" \
            "pytest-cov>=6.0.0" \
            "httpx2" \
            "uvicorn>=0.30.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Cache Chromium browser
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium browser
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Browser acceptance — fast lane
        if: matrix.shard == ''
        env:
          BROWSER_SUITE: fast
        run: xvfb-run -a npx playwright test --config tests/browser/playwright.ci.config.mjs

      - name: Browser acceptance — runtime shard ${{ matrix.shard }}
        if: matrix.shard != ''
        env:
          BROWSER_SUITE: runtime
        run: >-
          xvfb-run -a npx playwright test
          --config tests/browser/playwright.ci.config.mjs
          --fully-parallel
          --shard=${{ matrix.shard }}

      - name: Browser evidence (no credentials or auth traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-verification-browser-${{ matrix.lane }}
          path: |
            .test-stand/browser-output/
            .test-stand/browser-results.json
          if-no-files-found: error

  full-verification:
    if: always() && github.event.pull_request.draft == false
    needs: [integration, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every full verification lane
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$INTEGRATION_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
