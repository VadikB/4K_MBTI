name: Full verification

run-name: Full verification — ${{ github.ref_name }}

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent4k_pytest
          POSTGRES_USER: pytest
          POSTGRES_PASSWORD: pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytest -d agent4k_pytest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_POOL_MIN_SIZE: "0"
      DEEPSEEK_API_KEYS: ""
      TEST_DATABASE_URL: postgresql://pytest:pytest@127.0.0.1:5432/agent4k_pytest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115.0" \
            "pydantic>=2.0.0" \
            "psycopg[binary]>=3.2.0" \
            "psycopg_pool>=3.2.0" \
            "python-dotenv>=1.0.1" \
            "typst>=0.14.8" \
            "pypdf>=6.0.0" \
            "pytest>=8.3.0" \
            "pytest-cov>=6.0.0" \
            "httpx2" \
            "uvicorn>=0.30.0"

      - name: Unit tests
        run: python -m pytest -m "not integration and not e2e and not llm"

      - name: HTTP contract smoke tests
        run: python -m pytest -m e2e tests/e2e

      - name: Integration tests
        shell: bash
        run: |
          set +e
          python -m pytest --run-integration -m integration > /tmp/integration-tests.log 2>&1
          status=$?
          cat /tmp/integration-tests.log
          if [ "$status" -ne 0 ]; then
            details="$(tail -n 80 /tmp/integration-tests.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Integration tests failed::$details"
            exit "$status"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Browser acceptance (isolated bootstrap 10.2)
        env:
          STAND_ADMIN_URL: postgresql://pytest:pytest@127.0.0.1:5432/postgres
          BROWSER_PYTHON: python
        run: xvfb-run -a npm run test:browser

      - name: Browser evidence (no credentials or auth traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-verification-browser-acceptance
          path: |
            .test-stand/browser-output/
            .test-stand/browser-results.json
          if-no-files-found: error
